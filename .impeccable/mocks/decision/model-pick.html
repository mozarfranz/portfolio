<!doctype html>
<html><head><meta charset="utf-8"><title>Agent's Window sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#d9dde2;font-family:Arial,sans-serif;color:#111}
.band{background:#c8102e;color:#fff;height:300px;padding:40px 56px;display:grid;grid-template-columns:1fr 460px;gap:40px}
h1{font-size:68px;line-height:.95;font-weight:900;letter-spacing:-.02em}
.band p{font-size:20px;margin-top:16px}
form{background:#fff;color:#111;padding:20px;display:grid;gap:10px;border-radius:4px}
input{border:2px solid #111;padding:10px;font-size:15px}
button{background:#ffd100;border:0;padding:14px;font-size:18px;font-weight:900}
.win{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding:40px 56px}
.card{background:#fff;border-radius:4px;box-shadow:0 10px 20px rgba(0,0,0,.15);position:relative}
.ph{height:240px;background:#9aa4ae}
.card div.t{padding:14px;font-size:14px}.card b{display:block;font-size:24px}
.sold{position:absolute;top:16px;right:-8px;background:#ffd100;font-weight:900;padding:8px 16px;font-size:22px;transform:rotate(4deg)}
</style></head><body>
<div class="band"><div><h1>Shopify &amp; WordPress sites. Now showing.</h1><p>[Your Name] — freelance web developer, working worldwide.</p></div>
<form><input placeholder="Name"><input placeholder="Email"><input placeholder="Project"><button type="button">Book a viewing</button></form></div>
<div class="win">
<div class="card"><div class="ph"></div><span class="sold">LIVE</span><div class="t"><b>Client 01</b>Shopify · launched 2025</div></div>
<div class="card"><div class="ph"></div><span class="sold">LIVE</span><div class="t"><b>Client 02</b>WordPress · launched 2024</div></div>
<div class="card"><div class="ph"></div><div class="t"><b>Client 03</b>Shopify · launched 2024</div></div>
<div class="card"><div class="ph"></div><div class="t"><b>Client 04</b>WordPress · launched 2023</div></div>
</div></body></html>
