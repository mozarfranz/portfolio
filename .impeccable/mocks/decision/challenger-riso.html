<!doctype html>
<html><head><meta charset="utf-8"><title>Riso sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#f1f0ec;font-family:Impact,"Arial Black",sans-serif;position:relative}
.h{position:absolute;left:48px;top:90px;font-size:210px;line-height:.82;letter-spacing:-.02em}
.h span{display:block}
.b{color:#0078bf;mix-blend-mode:multiply}
.p{position:absolute;left:58px;top:98px;color:#ff48b0;mix-blend-mode:multiply}
.plate{position:absolute;right:80px;top:120px;width:420px;height:520px;background:#0078bf;mix-blend-mode:multiply;transform:rotate(3deg)}
.plate2{position:absolute;right:120px;top:160px;width:420px;height:520px;background:#ff48b0;mix-blend-mode:multiply;transform:rotate(-2deg)}
.slip{position:absolute;left:48px;bottom:48px;width:640px;background:#ffe800;padding:24px;font-family:Arial,sans-serif;display:flex;gap:10px}
.slip input{flex:1;border:2px solid #0078bf;background:transparent;padding:12px;font-size:16px}
.slip button{background:#0078bf;color:#fff;border:0;padding:12px 24px;font-size:18px;font-weight:900}
nav{position:absolute;top:28px;left:48px;right:48px;display:flex;justify-content:space-between;font-family:Arial,sans-serif;color:#0078bf;font-weight:700}
</style></head><body>
<nav><span>[Your Name]</span><span>Work / Services / Contact</span></nav>
<div class="h b"><span>WORDPRESS</span><span>+ SHOPIFY</span><span>SITES</span></div>
<div class="h p"><span>WORDPRESS</span><span>+ SHOPIFY</span><span>SITES</span></div>
<div class="plate2"></div><div class="plate"></div>
<div class="slip"><input placeholder="Email"><input placeholder="What do you need?"><button type="button">Send</button></div>
</body></html>
